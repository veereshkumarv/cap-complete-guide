# What: German texts for all messages raised by the service handlers.
# Why: [CAP-M05] / [CAP-M14] proves message localization: requests with Accept-Language: de get
#     these texts.
# If missing or unlinked: German users get the English texts (fallback to messages.properties).
INVALID_STATE=Die Bestellung {0} hat den Status {1}; die Aktion "{2}" ist nicht erlaubt.
PO_NO_ITEMS=Fügen Sie mindestens eine Position hinzu, bevor Sie die Bestellung {0} einreichen.
APPROVER_IS_REQUESTER=Sie haben die Bestellung {0} angelegt und können sie nicht selbst genehmigen oder ablehnen (Vier-Augen-Prinzip).
REJECT_COMMENT_REQUIRED=Geben Sie beim Ablehnen einer Bestellung einen Grund an.
PRODUCT_NOT_FOUND=Das Produkt {0} existiert nicht.
NEGATIVE_PRICE=Der Nettopreis darf nicht negativ sein.
INVALID_LIMIT=Das Limit muss eine ganze Zahl zwischen 1 und 100 sein.
ORDER_IN_DRAFT=Sichern Sie die Bestellung, bevor Sie ihren Status ändern.
ORDER_NOT_FOUND=Die Bestellung {0} existiert nicht.
REMOTE_UNAVAILABLE=Der S/4HANA-Geschäftspartnerservice ist nicht verfügbar. Versuchen Sie es später erneut.
ORDER_DRAFT_ONLY=Bestellungen werden als Entwurf angelegt - legen Sie einen Entwurf an und aktivieren Sie ihn.
SUPPLIER_BLOCKED=Der Lieferant {0} ist in S/4HANA gesperrt; es können keine Bestellungen bei ihm aufgegeben werden.
ORDER_BEING_EDITED=Die Bestellung {0} wird gerade bearbeitet. Sichern oder verwerfen Sie den Entwurf, bevor Sie ihren Status ändern.
ORDER_NOT_EDITABLE=Die Bestellung hat nicht mehr den Status Draft; Positionen und Anlagen können nicht mehr geändert werden.
ITEM_QUANTITY_MISSING=Jede Position der Bestellung {0} benötigt eine Menge von mindestens 1.
REMOTE_QUERY_NOT_SUPPORTED=Diese Abfrageoption wird für S/4HANA-Geschäftspartner nicht unterstützt: {0}.
REMOTE_FORBIDDEN=Sie sind nicht berechtigt, diese Geschäftspartner in S/4HANA zu lesen.
REMOTE_TIMEOUT=Der S/4HANA-Geschäftspartnerservice hat nicht rechtzeitig geantwortet. Versuchen Sie es später erneut.
