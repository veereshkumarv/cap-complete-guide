# What: Default (English) texts for all messages raised by the service handlers (req.error / req.reject).
# Why: [CAP-M05] handlers raise i18n keys, never literal texts; CAP picks the text in the request
#     language and substitutes {0}, {1}, ... with the message args.
# If missing or unlinked: Clients receive the raw keys (e.g. "INVALID_STATE") instead of readable text.
INVALID_STATE=Purchase order {0} is in status {1}; the action "{2}" is not allowed.
PO_NO_ITEMS=Add at least one item before submitting purchase order {0}.
APPROVER_IS_REQUESTER=You created purchase order {0} and cannot approve it yourself (four-eyes principle).
REJECT_COMMENT_REQUIRED=Enter a reason when rejecting a purchase order.
PRODUCT_NOT_FOUND=Product {0} does not exist.
NEGATIVE_PRICE=The net price must not be negative.
INVALID_LIMIT=The limit must be a whole number between 1 and 100.
ORDER_IN_DRAFT=Save the purchase order before changing its status.
ORDER_NOT_FOUND=Purchase order {0} does not exist.
REMOTE_UNAVAILABLE=The S/4HANA business partner service is not available. Try again later.
