# What: Test pipeline for pull requests and main: install, CDS lint, unit/integration tests.
# Why: [CAP-M23] / [CAP-S09] lint and tests gate every change; reused by release.yaml.
# If missing or unlinked: Broken changes reach main and are only found during deployment.
name: Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/checkout@v5
      - run: npm install
      - run: npx cds lint .
      - run: npm test
