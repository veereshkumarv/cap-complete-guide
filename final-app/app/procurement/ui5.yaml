# yaml-language-server: $schema=https://ui5.github.io/cli/schema/ui5.yaml.json
# What: UI5 tooling configuration of the Fiori app: build the app and zip it (with xs-app.json)
#     as procurement.zip for the HTML5 Application Repository.
# Why: [CAP-M22] / [CAP-STAGE-10] generated by `cds add html5-repo`; `npm run build` (ui5 build)
#     reads it during `mbt build`.
# If missing or unlinked: `ui5 build` does not know the project and no deployable zip is produced.
specVersion: '4.0'
metadata:
  name: procurement
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: procurement
        relativePaths: true
        additionalFiles:
          - xs-app.json
