# What: Multitarget application (MTA) descriptor of ACME Procurement for SAP BTP Cloud Foundry:
#     modules (CAP service, MTX sidecar with the tenant-upgrade hook, approuter, HTML5 app deployer,
#     Fiori app) and the BTP services they need (XSUAA, Service Manager/HANA, SaaS registry, Event Mesh,
#     Object Store, Malware Scanning, Audit Log, Destination, HTML5 repo, Cloud Logging).
# Why: [CAP-M22] / [CAP-STAGE-10] one archive (`mbt build`) deploys everything consistently
#     (`cf deploy`); generated by `cds add mta,html5-repo,malware-scanner,cloud-logging`, texts adapted.
# If missing or unlinked: Nothing can be built or deployed to Cloud Foundry - every module and
#     service would have to be pushed and bound by hand.
_schema-version: 3.3.0
ID: procurement-stage-10
version: 1.0.0
description: "ACME Procurement - stage 10: MTA deployment to SAP BTP Cloud Foundry (multitenant SaaS with approuter, HTML5 repository, HANA, XSUAA,
  messaging, audit log, object store) and CI/CD."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: procurement-stage-10-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: procurement-stage-10-auth
      - name: procurement-stage-10-db
      - name: procurement-stage-10-messaging
      - name: procurement-stage-10-attachments
      - name: procurement-stage-10-destination
      - name: procurement-stage-10-auditlog
      - name: procurement-stage-10-malware-scanner
      - name: procurement-stage-10-cloud-logging

  - name: procurement-stage-10-mtx
    type: nodejs
    path: gen/mtx/sidecar
    requires:
      - name: procurement-stage-10-auth
      - name: procurement-stage-10-db
      - name: procurement-stage-10-registry
      - name: app-api
        properties:
          SUBSCRIPTION_URL: ~{app-protocol}://\${tenant_subdomain}-~{app-uri}
      - name: procurement-stage-10-destination
      - name: procurement-stage-10-html5-runtime
      - name: procurement-stage-10-html5-repo-host
      - name: procurement-stage-10-cloud-logging
    build-parameters:
      builder: npm-ci
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
    hooks:
      - name: upgrade-all
        type: task
        phases:
          - blue-green.application.before-start.idle
          - deploy.application.before-start
        parameters:
          name: upgrade
          memory: 512M # increase as required
          disk-quota: 768M # increase as required
          command: cds-mtx upgrade '*'
    provides:
      - name: mtx-api
        properties:
          mtx-url: ${default-url}
  - name: procurement-stage-10
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    properties:
      TENANT_HOST_PATTERN: "^(.*)-${default-uri}"
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: mtx-api
        group: destinations
        properties:
          name: mtx-api # must be used in xs-app.json as well
          url: ~{mtx-url}
      - name: procurement-stage-10-auth
      - name: procurement-stage-10-destination
      - name: procurement-stage-10-html5-runtime
      - name: procurement-stage-10-cloud-logging
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: procurement-stage-10-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: procurementstage10procurement
          artifacts:
            - procurement.zip
          target-path: app/
    requires:
      - name: procurement-stage-10-auth
      - name: srv-api
      - name: procurement-stage-10-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

  - name: procurementstage10procurement
    type: html5
    path: app/procurement
    build-parameters:
      build-result: dist
      supported-platforms:
        []
      builder: custom
      commands:
        - npm ci
        - npm run build

resources:
  - name: procurement-stage-10-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: procurement-stage-10-${org}-${space}
        tenant-mode: shared
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Buyer (procurement-stage-10 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Buyer'
          - name: 'Admin (procurement-stage-10 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Admin'
          - name: 'Auditor (procurement-stage-10 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Auditor'
          - name: 'Approver (procurement-stage-10 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Approver'
          - name: 'Requester (procurement-stage-10 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Requester'
          - name: 'ExtensionDeveloper (procurement-stage-10 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ExtensionDeveloper'
    requires:
      - name: app-api
    processed-after:
      - procurement-stage-10-messaging
  - name: procurement-stage-10-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: service-manager
      service-plan: container
  - name: procurement-stage-10-registry
    type: org.cloudfoundry.managed-service
    requires:
      - name: mtx-api
    parameters:
      service: saas-registry
      service-plan: application
      config:
        xsappname: procurement-stage-10-${org}-${space}
        appName: procurement-stage-10-${org}-${space}
        displayName: ACME Procurement
        description: ACME Procurement - purchase orders with approval workflow (CAP complete guide, stage 10).
        category: 'Procurement'
        appUrls:
          getDependencies: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/dependencies
          onSubscription: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/tenant/{tenantId}
          onSubscriptionAsync: true
          onUnSubscriptionAsync: true
          onUpdateDependenciesAsync: true
          callbackTimeoutMillis: 300000 # Increase if your deployments are taking longer than that
  - name: procurement-stage-10-messaging
    type: org.cloudfoundry.managed-service
    parameters:
      service: enterprise-messaging
      service-plan: default
      path: ./event-mesh.json
  - name: procurement-stage-10-attachments
    type: org.cloudfoundry.managed-service
    parameters:
      service: objectstore
      service-plan: standard
  - name: procurement-stage-10-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: procurement-stage-10-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: procurement-stage-10-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: procurement-stage-10-auditlog
    type: org.cloudfoundry.managed-service
    parameters:
      service: auditlog
      service-plan: premium
  - name: procurement-stage-10-malware-scanner
    type: org.cloudfoundry.managed-service
    parameters:
      service: malware-scanner
      service-plan: clamav
      config:
        auth: mTLS
  - name: procurement-stage-10-cloud-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: cloud-logging
      service-plan: standard
      config:
        ingest_otlp:
          enabled: true
