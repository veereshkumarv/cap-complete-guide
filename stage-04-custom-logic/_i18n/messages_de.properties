# What: German texts for all messages raised by the service handlers.
# Why: [CAP-M05] / [CAP-M14] proves message localization: requests with Accept-Language: de get
#     these texts.
# If missing or unlinked: German users get the English texts (fallback to messages.properties).
INVALID_STATE=Die Bestellung {0} hat den Status {1}; die Aktion "{2}" ist nicht erlaubt.
PO_NO_ITEMS=Fügen Sie mindestens eine Position hinzu, bevor Sie die Bestellung {0} einreichen.
APPROVER_IS_REQUESTER=Sie haben die Bestellung {0} angelegt und können sie nicht selbst genehmigen (Vier-Augen-Prinzip).
REJECT_COMMENT_REQUIRED=Geben Sie beim Ablehnen einer Bestellung einen Grund an.
PRODUCT_NOT_FOUND=Das Produkt {0} existiert nicht.
NEGATIVE_PRICE=Der Nettopreis darf nicht negativ sein.
INVALID_LIMIT=Das Limit muss eine ganze Zahl zwischen 1 und 100 sein.
ORDER_IN_DRAFT=Sichern Sie die Bestellung, bevor Sie ihren Status ändern.
ORDER_NOT_FOUND=Die Bestellung {0} existiert nicht.
REMOTE_UNAVAILABLE=Der S/4HANA-Geschäftspartnerservice ist nicht verfügbar. Versuchen Sie es später erneut.
